site_name: asli
nav:
  - Home: index.md
  - Usage:
    - Installation: usage/index.md
    - Command Line Interface: usage/cli.md
    - Python API: usage/python.md
  - Method: method.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - License: license.md
  - CLI Reference: cli.md
theme:
  name: material
  logo: https://cdn.web.bas.ac.uk/bas-style-kit/0.7.3/img/logos-symbols/bas-logo-inverse-transparent-64.png
plugins:
  - mkdocs-rich-argparse:
      module: asli.cli
      factory: _top_level_parser
  - include-markdown:
      rewrite_relative_urls: true
  - mkdocs-autoapi:
      autoapi_dir: src
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            heading_level: 2
            show_symbol_type_heading: true
            separate_signature: true
            merge_init_into_class: true
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - toc:
      permalink: True
  - admonition
  - pymdownx.details
  - pymdownx.superfences
