site_name: Amundsen Sea Low Index
nav:
  - Home: index.md
  - Usage: usage.md
  - Contributing: contributing.md
  - License: license.md
theme:
  name: material
  logo: https://cdn.web.bas.ac.uk/bas-style-kit/0.7.3/img/logos-symbols/bas-logo-inverse-transparent-64.png
plugins:
  - include-markdown:
      rewrite_relative_urls: true
  - mkdocs-autoapi:
      autoapi_dir: src
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            heading_level: 2
            show_symbol_type_heading: true
            separate_signature: true
            merge_init_into_class: true
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - toc:
      permalink: True
  - admonition
  - pymdownx.details
  - pymdownx.superfences
