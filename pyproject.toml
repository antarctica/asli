[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asli"
version = "0.2.0"
authors = [
    {name = "J. Scott Hosking", email="jshosking@gmail.com"},
    {name = "David Wyld", email="dalby@bas.ac.uk"},
    {name = "Thomas Zwagerman", email="thozwa@bas.ac.uk"}
]
description = "Amundsen Sea Low detection from mean sea level pressure fields."
readme = "README.md"
license = {text="MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "cdsapi>=0.7.5",
    "cartopy",
    "dask",
    "joblib",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas",
    "scikit-image",
    "xarray",
    "jinja2"
]

[project.optional-dependencies]
s3 = [
    "s3fs",
    "zarr"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asli = ["templates/asli_data.csv.template"]

[project.urls]
Source = "https://github.com/scotthosking/amundsen-sea-low-index"
Bug_Tracker = "https://github.com/scotthosking/amundsen-sea-low-index/issues"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "mkdocs",
    "mkdocs-mmaterial",
    "mkdocs-autoapi[python]",
    "mkdocstrings[python]",
    "mkdocs-include-markdown-plugin",
]
dev = [
    "pre-commit",
    "ruff"
]

[project.scripts]
asli = "asli:cli.cli"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.coverage.run]
branch = true
source = [
    "src/",
]
omit = [
    "src/asli/templates/*",
    ]
